
name: Windows LTSC 24H2

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh

      - name: Download Docker Compose file
        run: |
          curl -fLO https://raw.githubusercontent.com/syuankai/Windowsplus/refs/heads/main/docker-compose-win.yml

      - name: Start Docker containers
        run: |
          sudo docker compose -f docker-compose-win.yml up -d

      - name: Check Docker
        run: |
          sudo docker ps

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt update
          sudo apt install -y ngrok

      - name: Configure and Start ngrok
        env:
          NGROK_USERKEY: ${{ secrets.ngrok_userkey }}
        run: |
          if [ -z "$NGROK_USERKEY" ]; then
            echo "Error: ngrok_userkey secret is not set!"
            exit 1
          fi

          ngrok config add-authtoken "$NGROK_USERKEY"

          nohup ngrok http 8006 > ngrok.log 2>&1 &

          echo "Waiting for ngrok to start..."
          sleep 5

          if ! pgrep -x ngrok >/dev/null; then
            echo "ngrok failed to start:"
            cat ngrok.log
            exit 1
          fi

          echo "ngrok is running!"

      - name: Ready
        run: |
          echo "The computer is ready!"

      - name: Keep Actions Running for 4 Hours
        run: |
          echo "Keeping the computer running for 4 hours..."
          sleep 14400
          echo "4 hours completed!"
          
